<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Footballer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Guess the Footballer</h1>
      <p class="sub" id="sub">Chargement des joueurs…</p>
    </div>
    <div class="modes" role="group" aria-label="Mode de jeu">
      <button class="btn" id="mDaily" aria-pressed="true">Joueur du jour</button>
      <button class="btn" id="mFree" aria-pressed="false">Partie libre</button>
    </div>
  </header>

  <section class="stage">
    <div class="slot" id="slot" aria-live="polite">
      <div class="flip">
        <div class="face front"><div class="q">?</div><small id="slotNum"></small></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="play">
      <label for="guess">Ton essai</label>
      <div class="combo">
        <input id="guess" type="text" autocomplete="off" disabled placeholder="Tape un nom (ex. Mbappé)" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list">
        <ul class="list" id="list" role="listbox" hidden></ul>
      </div>
      <div class="count" id="count"></div>
    </div>
  </section>

  <div class="gridwrap">
    <table>
      <thead><tr><th>Joueur</th><th>Championnat</th><th>Club</th><th>Nationalité</th><th>Poste</th><th>Né en</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="result" id="result">
    <h2 id="resTitle"></h2>
    <p id="resText" style="margin:0"></p>
    <div class="row">
      <button class="btn" id="share">Copier le résultat</button>
      <button class="btn" id="again" hidden>Nouvelle partie</button>
    </div>
  </div>

  <p class="legend">
    <b style="background:var(--hit)"></b>identique ·
    <b style="background:var(--near)"></b>proche (même continent, ou né à 2 ans près) ·
    <b style="background:var(--miss)"></b>différent. La flèche indique si le joueur mystère est né plus tôt ↓ ou plus tard ↑.
  </p>
  <p class="legend" id="updated"></p>
</main>
<script src="app.js"></script>
</body>
</html>
